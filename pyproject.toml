[project]
name = "pharma-data-extraction-eda"
version = "0.1.0"
description = "Pharmacological Network Analytics and Exploratory Data Analysis"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
